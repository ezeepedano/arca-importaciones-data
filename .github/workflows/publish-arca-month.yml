name: Publish ARCA to Hugging Face

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Mes ARCA en formato YYYYMM"
        required: true
        default: "202608"
  push:
    branches:
      - main
    paths:
      - ".run/request.json"

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      periods: ${{ steps.resolve.outputs.periods }}
      hf_dataset_repo: ${{ steps.resolve.outputs.hf_dataset_repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve dataset and periods
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          HF_DATASET_REPO="$(tr -d '[:space:]' < hf_dataset_repo.txt)"
          [[ "$HF_DATASET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "HF dataset repo invalido: $HF_DATASET_REPO"
            exit 4
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PERIOD="${{ inputs.periodo }}"
            [[ "$PERIOD" =~ ^20[0-9]{2}(0[1-9]|1[0-2])$ ]] || {
              echo "Periodo invalido: $PERIOD"
              exit 2
            }
            PERIODS="[\"$PERIOD\"]"
          else
            test -s .run/request.json
            COUNT="$(jq '.periods | if type == "array" then length else 0 end' .run/request.json)"
            [[ "$COUNT" -gt 0 ]] || {
              echo "request.json debe contener periods no vacio"
              exit 5
            }

            while IFS= read -r PERIOD; do
              [[ "$PERIOD" =~ ^20[0-9]{2}(0[1-9]|1[0-2])$ ]] || {
                echo "periodo invalido: $PERIOD"
                exit 2
              }
            done < <(jq -r '.periods[] | tostring' .run/request.json)

            PERIODS="$(jq -c '[.periods[] | tostring] | unique' .run/request.json)"
          fi

          echo "hf_dataset_repo=$HF_DATASET_REPO" >> "$GITHUB_OUTPUT"
          echo "periods=$PERIODS" >> "$GITHUB_OUTPUT"

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish dataset metadata and remove legacy taxes
        env:
          HF_DATASET_REPO: ${{ steps.resolve.outputs.hf_dataset_repo }}
          HF_OIDC_RESOURCE: datasets/${{ steps.resolve.outputs.hf_dataset_repo }}
        shell: bash
        run: |
          set -euo pipefail

          hf upload "$HF_DATASET_REPO"             dataset_card/README.md             README.md             --repo-type=dataset             --commit-message "Update historical dataset card"

          hf upload "$HF_DATASET_REPO"             schema.json             schema.json             --repo-type=dataset             --commit-message "Update historical schema"

          hf repos delete-files "$HF_DATASET_REPO"             "data/taxes/202608.parquet"             --repo-type=dataset             --commit-message "Remove legacy tax parquet; historical dataset is lean"             || echo "Legacy tax parquet already absent"

  process-and-publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        periodo: ${{ fromJSON(needs.prepare.outputs.periods) }}
    env:
      HF_DATASET_REPO: ${{ needs.prepare.outputs.hf_dataset_repo }}
      PERIODO: ${{ matrix.periodo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip month already published
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://huggingface.co/datasets/$HF_DATASET_REPO/resolve/main"
          META_URL="$BASE/metadata/months/$PERIODO.json"
          ITEM_URL="$BASE/data/items/$PERIODO.parquet"
          AGG_URL="$BASE/data/aggregates/$PERIODO.parquet"

          HAS_META=false
          HAS_DATA=false

          curl -fsIL "$META_URL" >/dev/null && HAS_META=true || true
          if curl -fsIL "$ITEM_URL" >/dev/null; then
            HAS_DATA=true
          elif curl -fsIL "$AGG_URL" >/dev/null; then
            HAS_DATA=true
          fi

          if [[ "$HAS_META" == "true" && "$HAS_DATA" == "true" ]]; then
            echo "SKIP_MONTH=true" >> "$GITHUB_ENV"
            echo "$PERIODO ya existe completo en Hugging Face; se omite."
          else
            echo "SKIP_MONTH=false" >> "$GITHUB_ENV"
            echo "$PERIODO necesita procesamiento."
          fi

      - name: Set up Python
        if: env.SKIP_MONTH != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: env.SKIP_MONTH != 'true'
        run: pip install -r requirements.txt

      - name: Process ARCA month
        if: env.SKIP_MONTH != 'true'
        run: python arca_full_to_parquet.py --periodo "$PERIODO" --out publish --items-only

      - name: Verify generated dataset
        if: env.SKIP_MONTH != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "publish/metadata/months/${PERIODO}.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import duckdb

          p = os.environ["PERIODO"]
          meta = json.loads(Path(f"publish/metadata/months/{p}.json").read_text())
          kind = meta.get("dataset_kind")

          if meta.get("include_taxes") is not False:
              raise SystemExit("el manifest no esta en modo lean/items-only")
          if meta.get("taxes_bytes") is not None:
              raise SystemExit("taxes_bytes debe ser null")

          if kind == "items":
              path = Path(f"publish/data/items/{p}.parquet")
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit("items parquet faltante")
              count = duckdb.sql(
                  f"select count(*) from read_parquet('{path}')"
              ).fetchone()[0]
              if meta.get("unique_items") != count:
                  raise SystemExit("manifest/item count inconsistente")
              if Path(f"publish/data/aggregates/{p}.parquet").exists():
                  raise SystemExit("no debe existir aggregate parquet para items")
          elif kind == "aggregates":
              path = Path(f"publish/data/aggregates/{p}.parquet")
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit("aggregate parquet faltante")
              count = duckdb.sql(
                  f"select count(*) from read_parquet('{path}')"
              ).fetchone()[0]
              if meta.get("aggregate_rows") != count:
                  raise SystemExit("manifest/aggregate count inconsistente")
              if Path(f"publish/data/items/{p}.parquet").exists():
                  raise SystemExit("no debe existir items parquet para agregado")
          else:
              raise SystemExit(f"dataset_kind desconocido: {kind}")

          if count <= 0:
              raise SystemExit("dataset mensual vacio")

          Path(".dataset_kind").write_text(kind)
          print("periodo", p, "kind", kind, "rows", count)
          PY

          echo "DATASET_KIND=$(cat .dataset_kind)" >> "$GITHUB_ENV"

      - name: Install Hugging Face CLI
        if: env.SKIP_MONTH != 'true'
        shell: bash
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish processed month
        if: env.SKIP_MONTH != 'true'
        env:
          HF_OIDC_RESOURCE: datasets/${{ needs.prepare.outputs.hf_dataset_repo }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DATASET_KIND" == "items" ]]; then
            hf upload "$HF_DATASET_REPO"               "publish/data/items/${PERIODO}.parquet"               "data/items/${PERIODO}.parquet"               --repo-type=dataset               --commit-message "ARCA ${PERIODO}: detailed items"
          elif [[ "$DATASET_KIND" == "aggregates" ]]; then
            hf upload "$HF_DATASET_REPO"               "publish/data/aggregates/${PERIODO}.parquet"               "data/aggregates/${PERIODO}.parquet"               --repo-type=dataset               --commit-message "ARCA ${PERIODO}: aggregate imports"
          else
            echo "DATASET_KIND invalido: $DATASET_KIND"
            exit 6
          fi

          hf upload "$HF_DATASET_REPO"             "publish/metadata/months/${PERIODO}.json"             "metadata/months/${PERIODO}.json"             --repo-type=dataset             --commit-message "ARCA ${PERIODO}: metadata"

      - name: Month summary
        shell: bash
        run: |
          if [[ "${SKIP_MONTH:-false}" == "true" ]]; then
            echo "ARCA $PERIODO: already published"
          else
            echo "ARCA $PERIODO: $DATASET_KIND processed and published"
          fi
